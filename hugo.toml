baseURL = "https://kraken8081.github.io/photo-portfolio/"
title = "光阴相册"
copyright = "© YJiang"
defaultContentLanguage = "zh"
languageCode = "zh-CN"
hasCJKLanguage = true
disableKinds = ["taxonomy"]
enableRobotsTXT = true
timeZone = "Asia/Shanghai"
timeout = "120s"

[params]
  defaultTheme = "light"
  title = "光阴相册"
  description = "把走过的路、平常的日子，和宝宝一点点长大的样子，都好好收起来。"
  [params.author]
    name = "YJiang"
  # 相册网格：更大行高 + 更宽间距 → 宽屏更少列、浏览更松
  [params.gallery]
    boxSpacing = 24
    targetRowHeight = 380
    targetRowHeightTolerance = 0.2

[outputs]
  home = ["HTML", "RSS"]
  page = ["HTML"]
  section = ["HTML"]

[imaging]
  quality = 82
  resampleFilter = "CatmullRom"
  [imaging.exif]
    disableDate = false
    disableLatLong = true   # 不公开拍摄地点 GPS
    includeFields = "ImageDescription|Orientation"

[module]
  [module.hugoVersion]
    min = "0.123.0"
  [[module.imports]]
    path = "github.com/nicokaiser/hugo-theme-gallery/v4"

[menu]
  [[menu.main]]
    name = "关于我"
    pageRef = "/about"
    weight = 10
