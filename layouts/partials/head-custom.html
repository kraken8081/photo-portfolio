{{- /* Motion polish: mark early so home cards can start hidden without FOUC */ -}}

  try {
    if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      document.documentElement.classList.add("has-motion-js");
    }
  } catch (e) {}
</script>
